name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:

  review:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Checkout Repository
      # ------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Extract Pull Request Diff
      # ------------------------------------------------

      - name: Get PR Diff
        run: |
          curl -L \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          ${{ github.event.pull_request.diff_url }} \
          -o diff.txt

      # ------------------------------------------------
      # Load Review Rules & Mentor Style
      # ------------------------------------------------

      - name: Load Review Context
        run: |
          cat REVIEW_RULES.md > context.txt
          echo "" >> context.txt
          cat MENTOR_STYLE.md >> context.txt

      # ------------------------------------------------
      # Static Analysis Checks
      # ------------------------------------------------

      - name: Static Analysis
        run: |

          echo "## Static Analysis Findings" > static_analysis.txt

          echo "" >> static_analysis.txt
          echo "### print() usage" >> static_analysis.txt
          grep -rn "print(" . >> static_analysis.txt || echo "No print statements found" >> static_analysis.txt

          echo "" >> static_analysis.txt
          echo "### sudo() usage" >> static_analysis.txt
          grep -rn "sudo()" . >> static_analysis.txt || echo "No sudo misuse found" >> static_analysis.txt

          echo "" >> static_analysis.txt
          echo "### Raw SQL usage" >> static_analysis.txt
          grep -rn "cr.execute" . >> static_analysis.txt || echo "No raw SQL found" >> static_analysis.txt

      # ------------------------------------------------
      # Build AI Prompt
      # ------------------------------------------------

      - name: Build Prompt
        run: |

          cat <<EOF > prompt.txt
          You are a strict senior Odoo reviewer reviewing a pull request before it reaches production.

          Review ONLY the changed code from this pull request diff.

          Your responsibilities:
          - identify ORM misuse
          - identify performance issues
          - identify maintainability problems
          - identify naming issues
          - identify spelling or grammar issues
          - suggest better Odoo practices
          - review code like an experienced Belgian Odoo reviewer

          Also provide:
          - quality score out of 10
          - readability score
          - ORM usage score
          - maintainability score
          - performance score

          Repository Standards:
          $(cat context.txt)

          Static Analysis Findings:
          $(cat static_analysis.txt)

          Pull Request Diff:
          $(head -c 12000 diff.txt)

          Output Format:

          ## AI Review Score
          Overall: X/10

          Readability: X/10
          Performance: X/10
          ORM Usage: X/10
          Maintainability: X/10

          ## Review Summary

          ...

          ## Inline Suggestions

          - file.py line X:
            suggestion

          ## Performance Issues

          ...

          ## Spelling / Naming Issues

          ...

          ## Suggested Refactors

          ```python
          improved code example
          ```

          EOF

      # ------------------------------------------------
      # Generate AI Review Using Groq
      # ------------------------------------------------

      - name: Generate AI Review
        run: |

          PROMPT=$(jq -Rs . < prompt.txt)

          curl https://api.groq.com/openai/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.GROQ_API_KEY }}" \
          -d "{
            \"model\": \"llama-3.3-70b-versatile\",
            \"messages\": [
              {
                \"role\": \"system\",
                \"content\": \"You are a strict senior Odoo reviewer.\"
              },
              {
                \"role\": \"user\",
                \"content\": $PROMPT
              }
            ],
            \"temperature\": 0.2
          }" \
          > response.json

      # ------------------------------------------------
      # Debug Full AI Response
      # ------------------------------------------------

      - name: Debug AI Response
        run: |
          echo "========= FULL RESPONSE ========="
          cat response.json

      # ------------------------------------------------
      # Validate AI Response
      # ------------------------------------------------

      - name: Validate Response
        run: |

          if grep -q '"error"' response.json; then
            echo "AI API Error:"
            cat response.json
            exit 1
          fi

      # ------------------------------------------------
      # Extract AI Review
      # ------------------------------------------------

      - name: Extract Review
        run: |

          REVIEW=$(cat response.json | jq -r '
            .choices[0].message.content // "No review generated"
          ')

          echo "$REVIEW" > final_review.txt

          echo "========= AI REVIEW ========="
          cat final_review.txt

      # ------------------------------------------------
      # Post Main PR Comment
      # ------------------------------------------------

      - name: Post Review Comment
        run: |

          COMMENT=$(jq -Rs . < final_review.txt)

          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          -d "{\"body\": $COMMENT }"

      # ------------------------------------------------
      # Add Automatic Labels
      # ------------------------------------------------

      - name: Add Labels
        run: |

          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
          -d '{
            "labels":[
              "ai-reviewed",
              "needs-review"
            ]
          }'