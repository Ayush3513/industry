name: AI Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:

  review:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout Repository
      # ----------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Extract PR Diff
      # ----------------------------------------

      - name: Get PR Diff
        run: |
          curl -L \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          ${{ github.event.pull_request.diff_url }} \
          -o diff.txt

      # ----------------------------------------
      # Load Repository Rules
      # ----------------------------------------

      - name: Load Review Rules
        run: |
          cat REVIEW_RULES.md > context.txt
          echo "" >> context.txt
          cat MENTOR_STYLE.md >> context.txt

      # ----------------------------------------
      # Build AI Prompt
      # ----------------------------------------

      - name: Build Prompt
        run: |

          cat <<EOF > prompt.txt
          You are a strict senior Odoo reviewer reviewing a pull request before it reaches production.

          Review ONLY the changed code from this PR diff.

          Your responsibilities:
          - identify ORM misuse
          - identify performance issues
          - identify maintainability problems
          - identify naming issues
          - identify spelling or grammar issues
          - suggest better Odoo practices
          - review code like an experienced Belgian Odoo reviewer

          Repository Standards:
          $(cat context.txt)

          PR Diff:
          $(head -c 12000 diff.txt)

          Output Format:

          ## Review Summary

          ...

          ## Inline Suggestions

          - file.py line X:
            suggestion

          ## Performance Issues

          ...

          ## Spelling / Naming Issues

          ...

          EOF

      # ----------------------------------------
      # Generate AI Review (OpenRouter)
      # ----------------------------------------

      - name: Generate AI Review
        run: |

          PROMPT=$(jq -Rs . < prompt.txt)

          curl https://openrouter.ai/api/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
          -d "{
            \"model\": \"deepseek/deepseek-chat-v3-0324:free\",
            \"messages\": [
              {
                \"role\": \"system\",
                \"content\": \"You are a strict senior Odoo reviewer.\"
              },
              {
                \"role\": \"user\",
                \"content\": $PROMPT
              }
            ]
          }" \
          > response.json

      # ----------------------------------------
      # Debug Full Response
      # ----------------------------------------

      - name: Debug AI Response
        run: |
          echo "========= FULL RESPONSE ========="
          cat response.json

      # ----------------------------------------
      # Validate API Response
      # ----------------------------------------

      - name: Validate Response
        run: |

          if grep -q '"error"' response.json; then
            echo "AI API Error:"
            cat response.json
            exit 1
          fi

      # ----------------------------------------
      # Extract AI Review
      # ----------------------------------------

      - name: Extract Review
        run: |

          REVIEW=$(cat response.json | jq -r '
            .choices[0].message.content // "No review generated"
          ')

          echo "$REVIEW" > final_review.txt

          echo "========= AI REVIEW ========="
          cat final_review.txt

      # ----------------------------------------
      # Post Comment To Pull Request
      # ----------------------------------------

      - name: Post Review Comment
        run: |

          COMMENT=$(jq -Rs . < final_review.txt)

          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          -d "{\"body\": $COMMENT }"