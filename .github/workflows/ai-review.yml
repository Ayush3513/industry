name: AI Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR diff
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          ${{ github.event.pull_request.diff_url }} > diff.txt

      - name: Show diff (debug)
        run: cat diff.txt